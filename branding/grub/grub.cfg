source /boot/grub/config.cfg

menuentry "Start LiteLink OS" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Start LiteLink OS (run from RAM)" --hotkey=r {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram
	initrd	@INITRD_LIVE@
}

menuentry "Start LiteLink OS (safe graphics)" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

menuentry "Install LiteLink OS" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ litelink.install
	initrd	@INITRD_LIVE@
}

submenu "Utilities" --hotkey=u {
	source /boot/grub/theme.cfg

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "Firmware settings" --hotkey=f {
			fwsetup
		}
	fi

	menuentry "Verify boot medium" --hotkey=v {
		linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
		initrd	@INITRD_LIVE@
	}

	menuentry "Restart" {
		reboot
	}

	menuentry "Power off" {
		halt
	}
}
