set default=0
set timeout=3
set timeout_style=menu

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=1280x720,1024x768,auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

loadfont $prefix/inter-regular-14.pf2
loadfont $prefix/inter-regular-18.pf2
loadfont $prefix/inter-medium-18.pf2

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
