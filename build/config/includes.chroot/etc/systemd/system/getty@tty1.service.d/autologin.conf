[Service]
# Silent autologin: no issue banner, no login prompt, no "automatic login" line.
ExecStart=
ExecStart=-/sbin/agetty --skip-login --nonewline --noissue --noclear --autologin litelink %I $TERM
# No terminal reset. The boot splash is still running on tty1 when this
# starts, and Plymouth reads tty1 as its keyboard. With TTYReset=yes systemd
# 257 asks the terminal for its size (ESC[6n) and waits for the reply on
# tty1's input; Plymouth can take that reply first, leaving the autologin
# waiting until a key is pressed, so the splash never hands over to the
# desktop. agetty sets up the terminal itself; X takes the display after it.
TTYReset=no
