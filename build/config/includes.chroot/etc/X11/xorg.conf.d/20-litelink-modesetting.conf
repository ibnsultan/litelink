# LiteLink OS: plain 2D on the modesetting driver.
# Glamor (OpenGL 2D acceleration) falls back to llvmpipe without a GPU and
# took ~7 s to initialise in testing, leaving a black screen before the
# desktop. A thin client only needs 2D; FreeRDP draws the remote desktop.
Section "Device"
    Identifier "LiteLink modesetting"
    Driver     "modesetting"
    Option     "AccelMethod" "none"
EndSection
